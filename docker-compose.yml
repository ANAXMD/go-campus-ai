services:
  postgres-db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: campus_db
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:z
  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      CAMPUS_SECRET: "super_secret_999"
    depends_on:
      - postgres-db