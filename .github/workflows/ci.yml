name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (race detector on)
        run: go test -race -count=1 ./...

      - name: Build Docker image
        run: docker build -t go-campus-ai:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: campus-frontend-v2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: campus-frontend-v2/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
